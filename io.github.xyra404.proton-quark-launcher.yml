app-id: io.github.xyra404.proton-quark-launcher
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: proton-quark-launcher

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=~/.steam:ro
  - --filesystem=~/.local/share/Steam:ro
  - --filesystem=/usr/share/steam:ro
  - --filesystem=~/.var/app/com.valvesoftware.Steam:ro
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: proton-quark-launcher
    buildsystem: simple
    build-commands:
      - bsdtar -xf data.tar.* -C .
      - install -Dm755 usr/bin/proton-quark-launcher /app/bin/proton-quark-launcher
      - install -Dm644 usr/share/applications/*.desktop /app/share/applications/io.github.xyra404.proton-quark-launcher.desktop
      - install -Dm644 usr/share/icons/hicolor/*/apps/*.png /app/share/icons/hicolor/128x128/apps/io.github.xyra404.proton-quark-launcher.png
    sources:
      - type: file
        url: https://github.com/xyra404/proton-quark-launcher/releases/download/vX.Y.Z/proton-quark-launcher_X.Y.Z_amd64.deb
        sha256: REPLACE_WITH_REAL_SHA256_OF_THE_DEB