name: Build Linux Release

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch: {}

jobs:
  build-linux:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # needed to create the GitHub Release + tag
    outputs:
      version: ${{ steps.artifacts.outputs.version }}

    steps:
      - name: Checkout master (post-merge)
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      # App icons are generated ONCE locally with:
      #   npm run tauri icon assets/proton-quark-logo.png
      # and the resulting src-tauri/icons/ directory is committed to the repo.
      # This step just fails fast with a clear message if someone forgot to
      # commit them, instead of letting the bundler fail cryptically later.
      - name: Verify app icons are present
        run: |
          for f in icons/32x32.png icons/128x128.png icons/128x128@2x.png icons/icon.icns icons/icon.ico; do
            if [ ! -f "src-tauri/$f" ]; then
              echo "::error::Missing icon file src-tauri/$f — run 'npm run tauri icon assets/proton-quark-logo.png' locally and commit the icons/ directory."
              exit 1
            fi
          done

      # tauri.conf.json is the single source of truth for versioning.
      # This step reads its "version" field and writes that same value into
      # package.json, so the two never drift — bump the version in
      # tauri.conf.json only, and this keeps npm/package.json in lockstep.
      - name: Sync version from tauri.conf.json into package.json
        run: |
          TAURI_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "Syncing version: $TAURI_VERSION"
          npm pkg set version="$TAURI_VERSION"

      - name: Verify version sync
        run: |
          echo "tauri.conf.json version: $(jq -r '.version' src-tauri/tauri.conf.json)"
          echo "package.json version: $(node -p "require('./package.json').version")"

      - name: Build Linux bundles (AppImage, deb, rpm)
        run: npm run tauri build -- --bundles deb,rpm,appimage

      - name: Locate build artifacts
        id: artifacts
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          find src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \)

      # --- EGL_BAD_PARAMETER fix -------------------------------------------
      # Confirmed root cause: the AppImage bundles Ubuntu 22.04's own
      # libwayland-client/cursor/egl/server libraries via linuxdeploy. On
      # systems with a much newer Wayland/Mesa stack (e.g. Arch/CachyOS),
      # these bundled libraries are version-mismatched against the host's
      # compositor, causing WebKitGTK to fail EGL initialization with
      # "Could not create default EGL display: EGL_BAD_PARAMETER" and a
      # blank white window — even though the exact same build works fine
      # when done locally on a matching system.
      #
      # Fix: delete the bundled libwayland-*.so* files so the binary falls
      # through to the host's own matching copies at runtime, then repack.
      - name: Strip bundled libwayland libraries from AppImage
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -n1)
          echo "Repacking: $APPIMAGE"

          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          rm "$APPIMAGE"

          find squashfs-root \( \
            -path "*/libwayland-client.so*" -o \
            -path "*/libwayland-cursor.so*" -o \
            -path "*/libwayland-egl.so*" -o \
            -path "*/libwayland-server.so*" \
          \) -print -delete

          # appimagetool releases on the legacy AppImageKit repo 404 —
          # pull from the maintained AppImage/appimagetool repo instead.
          curl -L -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool

          # No FUSE available on GitHub-hosted runners.
          ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: proton-quark-launcher-${{ steps.artifacts.outputs.version }}-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: proton-quark-launcher-${{ steps.artifacts.outputs.version }}-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: proton-quark-launcher-${{ steps.artifacts.outputs.version }}-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      # Creates/refreshes a tagged GitHub Release with all three bundles attached.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.artifacts.outputs.version }}
          name: v${{ steps.artifacts.outputs.version }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
