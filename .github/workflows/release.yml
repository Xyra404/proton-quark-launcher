name: Build Linux Release

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch: {}

jobs:
  build-linux:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # needed to create the GitHub Release + tag, and to
                        # commit the updated Flatpak manifest back to master
    outputs:
      version: ${{ steps.artifacts.outputs.version }}
      deb_sha256: ${{ steps.checksum.outputs.sha }}

    steps:
      - name: Checkout master (post-merge)
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      # App icons are generated ONCE locally with:
      #   npm run tauri icon assets/proton-quark-logo.png
      # and the resulting src-tauri/icons/ directory is committed to the repo.
      # This step just fails fast with a clear message if someone forgot to
      # commit them, instead of letting the bundler fail cryptically later.
      - name: Verify app icons are present
        run: |
          for f in icons/32x32.png icons/128x128.png icons/128x128@2x.png icons/icon.icns icons/icon.ico; do
            if [ ! -f "src-tauri/$f" ]; then
              echo "::error::Missing icon file src-tauri/$f — run 'npm run tauri icon assets/proton-quark-logo.png' locally and commit the icons/ directory."
              exit 1
            fi
          done

      - name: Sync version from package.json into tauri.conf.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Syncing version: $PKG_VERSION"
          jq --arg v "$PKG_VERSION" '.version = $v' \
            src-tauri/tauri.conf.json > src-tauri/tauri.conf.tmp.json
          mv src-tauri/tauri.conf.tmp.json src-tauri/tauri.conf.json

      - name: Verify version sync
        run: |
          echo "package.json version: $(node -p "require('./package.json').version")"
          echo "tauri.conf.json version: $(jq -r '.version' src-tauri/tauri.conf.json)"

      - name: Build Linux bundles (AppImage, deb, rpm)
        run: npm run tauri build -- --bundles deb,rpm,appimage

      - name: Locate build artifacts
        id: artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          find src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \)

      - name: Compute sha256 of the built .deb
        id: checksum
        run: |
          DEB_PATH=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -n1)
          SHA=$(sha256sum "$DEB_PATH" | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Computed sha256: $SHA for $DEB_PATH"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: proton-quark-launcher-${{ steps.artifacts.outputs.version }}-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: proton-quark-launcher-${{ steps.artifacts.outputs.version }}-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: proton-quark-launcher-${{ steps.artifacts.outputs.version }}-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      # Creates/refreshes a tagged GitHub Release with all three bundles
      # attached. This is what gives both the AUR job and the Flatpak
      # manifest a stable, public, checksummed URL to download from.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.artifacts.outputs.version }}
          name: v${{ steps.artifacts.outputs.version }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

      # Keeps io.github.xyra404.proton-quark-launcher.yml pointed at the
      # release we just cut, so the manifest is always ready to submit or
      # resubmit to Flathub without manual editing.
      - name: Update Flatpak manifest version + checksum
        run: |
          VERSION="${{ steps.artifacts.outputs.version }}"
          SHA="${{ steps.checksum.outputs.sha }}"
          MANIFEST="io.github.xyra404.proton-quark-launcher.yml"
          sed -i \
            -e "s|releases/download/v[^/]*/proton-quark-launcher_[^\"']*_amd64\.deb|releases/download/v${VERSION}/proton-quark-launcher_${VERSION}_amd64.deb|" \
            -e "s|sha256:.*|sha256: ${SHA}|" \
            "$MANIFEST"
          cat "$MANIFEST"

      - name: Commit updated Flatpak manifest back to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add io.github.xyra404.proton-quark-launcher.yml
          git diff --cached --quiet && echo "No manifest changes" || \
            git commit -m "chore: sync flatpak manifest to v${{ steps.artifacts.outputs.version }}"
          git push origin master || echo "Nothing to push"

  validate-flatpak:
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout master (with updated manifest)
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Install Flatpak + Flatpak Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.flatpak.Builder

      - name: Lint the Flatpak manifest
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            manifest io.github.xyra404.proton-quark-launcher.yml

      - name: Build the Flatpak (dry run, no install)
        run: |
          flatpak run --command=flathub-build org.flatpak.Builder \
            io.github.xyra404.proton-quark-launcher.yml

  publish-aur:
    needs: build-linux
    runs-on: ubuntu-latest
    # Skips cleanly instead of hard-failing while AUR registration is frozen
    # and you don't yet have AUR_SSH_PRIVATE_KEY configured as a secret.
    # Flip the "AUR_ENABLED" repository VARIABLE (Settings > Secrets and
    # variables > Actions > Variables) to "true" once AUR is set up.
    if: ${{ vars.AUR_ENABLED == 'true' }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Render PKGBUILD with real version + checksum
        run: |
          VERSION="${{ needs.build-linux.outputs.version }}"
          SHA="${{ needs.build-linux.outputs.deb_sha256 }}"
          sed -e "s/^pkgver=.*/pkgver=${VERSION}/" \
              -e "s/^sha256sums=.*/sha256sums=('${SHA}')/" \
              aur/PKGBUILD.template > aur/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: proton-quark-launcher-bin
          pkgbuild: ./aur/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ needs.build-linux.outputs.version }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
